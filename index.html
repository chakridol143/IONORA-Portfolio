<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IONORA - Portfolio</title>

  <!-- ✅ LOADER CSS MUST LOAD FIRST -->
  <link rel="stylesheet" href="loader.css" />

  <!-- EXISTING STYLES (UNCHANGED) -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="header.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- EXISTING LIBS (UNCHANGED) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body class="hero loading">

  <!-- =========================
       INLINE LOADER (NO FETCH)
  ========================== -->
  <div id="page-loader">
    <div class="loader-glow"></div>

    <div class="loader-content">

      <!-- BRAND -->
      <div class="brand-name">
        <span>I</span><span>O</span><span>N</span>
        <span>O</span><span>R</span><span>A</span>
      </div>

      <!-- UNDERLINES -->
      <div class="nevera-lines">
        <span class="line"></span>
        <span class="line"></span>
        <span class="line"></span>
      </div>

    </div>
  </div>
  <!-- ========================= -->

  <!-- EXISTING CONTENT (UNCHANGED) -->
  <div id="global-header"></div>

  <main class="app">

    <section class="viewer" id="viewer">
      <div class="scroll-indicator">
        <div class="scroll-text">Scroll to explore</div>
      </div>

      <div class="stack" id="stack">
        <video id="v0" class="slot" playsinline muted loop preload="auto"></video>
        <video id="v1" class="slot" playsinline muted loop preload="auto"></video>
        <video id="v2" class="slot" playsinline muted loop preload="auto"></video>
        <video id="v3" class="slot" playsinline muted loop preload="auto"></video>
      </div>

      <div class="overlay" id="overlay">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
        <button id="btnExp" class="glow-btn"></button>
      </div>
    </section>

    <nav class="side-nav">
      <ul>
        <li class="side-nav-item active" data-index="0"><span class="num">01</span><span class="label">IONORA</span></li>
        <li class="side-nav-item" data-index="1"><span class="num">02</span><span class="label">SOFTWARE SOLUTIONS</span></li>
        <li class="side-nav-item" data-index="2"><span class="num">03</span><span class="label">DIGITAL MARKETING</span></li>
        <li class="side-nav-item" data-index="3"><span class="num">04</span><span class="label">ABOUT US</span></li>
      </ul>
    </nav>

  </main>

  <!-- HEADER INJECTION (UNCHANGED) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("global-header").innerHTML = html;

          const s = document.createElement("script");
          s.src = "header.js";
          s.onload = () => initHeaderMenu();
          document.body.appendChild(s);
        });
    });
  </script>

  <!-- EXISTING SCRIPTS (ORDER MATTERS) -->
  <script src="script.js"></script>
  <script src="loader.js"></script>

</body>
</html>
