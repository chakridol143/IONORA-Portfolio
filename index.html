<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IONORA - Portfolio</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="header.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body class="hero">

  <div id="global-header"></div>

  <main class="app">

    <section class="viewer" id="viewer">
      <div class="stack" id="stack">
        <video id="v0" class="slot" playsinline muted loop preload="auto"></video>
        <video id="v1" class="slot" playsinline muted loop preload="auto"></video>
        <video id="v2" class="slot" playsinline muted loop preload="auto"></video>
        <video id="v3" class="slot" playsinline muted loop preload="auto"></video>
      </div>

      <div class="overlay" id="overlay">
        <h1 id="title"></h1>
        <p id="subtitle"></p>
        <button id="btnExp" class="glow-btn"></button>
      </div>
    </section>

    <nav class="side-nav">
      <ul>
        <li class="side-nav-item active" data-index="0"><span class="num">01</span><span class="label">IONORA</span></li>
        <li class="side-nav-item" data-index="1"><span class="num">02</span><span class="label">SOFTWARE SOLUTIONS</span></li>
        <li class="side-nav-item" data-index="2"><span class="num">03</span><span class="label">DIGITAL MARKETING</span></li>
        <li class="side-nav-item" data-index="3"><span class="num">04</span><span class="label">ABOUT US</span></li>
      </ul>
    </nav>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("global-header").innerHTML = html;

          // load menu behaviour AFTER header is injected
          const s = document.createElement("script");
          s.src = "header.js";
          s.onload = () => initHeaderMenu();
          document.body.appendChild(s);
        });
    });
  </script>

  <!-- your GSAP homepage script -->
  <script src="script.js"></script>

</body>
</html>
