<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Us — IONORA</title>
  
  <link rel="stylesheet" href="bstyle.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="contact.css">
  
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-left">
        <img src="images/ionora-logo.avif" alt="Logo" class="logo">
       <!-- <span class="title">Powerfrill</span>-->
      </div>
      <div class="header-right">
        <i class='bx bx-menu bx-md' id="menu-toggle"></i>
      </div>
    </header>

    <!-- Contact Section -->
    <section class="contact-section">
      <div class="contact-container">
        <h1 class="contact-title">Get in Touch</h1>
        <h2 class="contact-subtitle">CONTACT US</h2>
        
        <div class="contact-content">
          <div class="contact-info">
            <h3>Ready to build Your Future?</h3>
            <p>Contact us today to know more about our services and how we can help you achieve your sustainability goals.</p>
            
            <div class="contact-details">
              <div class="contact-item">
                <i class='bx bx-envelope'></i>
                <span>ionoraitsolutions@gmail.com</span>
              </div>
              <div class="contact-item">
                <i class='bx bx-phone'></i>
                <span>+91 123-456-7890</span>
              </div>
              <div class="contact-item">
                <i class='bx bx-map'></i>
                <span>HI-tech City, Hyderabad</span>
              </div>
            </div>
          </div>
          
          <div class="contact-form">
            <form>
              <div class="form-group">
                <input type="text" placeholder="Your Name" required>
              </div>
              <div class="form-group">
                <input type="email" placeholder="Your Email" required>
              </div>
              <div class="form-group">
                <input type="text" placeholder="Subject" required>
              </div>
              <div class="form-group">
                <textarea placeholder="Your Message" rows="5" required></textarea>
              </div>
              <button type="submit" class="submit-btn">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </section>

  
  </main>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class='bx bx-x bx-sm' id="close-sidebar"></i>
    </div>
    <ul class="sidebar-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="product.html">Products</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact Us</a></li>
    </ul>
  </div>

  <div class="overlay-bg" id="overlay-bg"></div>

  <script src="script.js"></script>
</body>
</html>
