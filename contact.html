<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Us — IONORA</title>
  
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="contact.css">
  
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
  <div id="global-header"></div>
  <main class="app">
    <!-- Contact Section -->
    <section class="contact-section">
      <div class="contact-container">
        <h1 class="contact-title">Get in Touch</h1>
        <h2 class="contact-subtitle">CONTACT US</h2>
        
        <div class="contact-content">
          <div class="contact-info">
            <h3>Ready to build Your Future?</h3>
            <p>Contact us today to know more about our services and how we can help you achieve your sustainability goals.</p>
            
            <div class="contact-details">
              <div class="contact-item">
                <i class='bx bx-envelope'></i>
                <span>ionoraitsolutions@gmail.com</span>
              </div>
              <div class="contact-item">
                <i class='bx bx-phone'></i>
                <span>+91 123-456-7890</span>
              </div>
              <div class="contact-item">
                <i class='bx bx-map'></i>
                <span>HI-tech City, Hyderabad</span>
              </div>
            </div>
          </div>
          
          <div class="contact-form">
            <form>
              <div class="form-group">
                <input type="text" placeholder="Your Name" required>
              </div>
              <div class="form-group">
                <input type="email" placeholder="Your Email" required>
              </div>
              <div class="form-group">
                <input type="text" placeholder="Subject" required>
              </div>
              <div class="form-group">
                <textarea placeholder="Your Message" rows="5" required></textarea>
              </div>
              <button type="submit" class="submit-btn">Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </section>

  
  </main>

  <div class="overlay-bg" id="overlay-bg"></div>
 <script>
    document.addEventListener("DOMContentLoaded", () => {
      fetch("header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("global-header").innerHTML = html;

          // load menu behaviour AFTER header is injected
          const s = document.createElement("script");
          s.src = "header.js";
          s.onload = () => initHeaderMenu();
          document.body.appendChild(s);
        });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
